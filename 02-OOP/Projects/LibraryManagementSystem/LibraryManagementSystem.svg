<g><rect x="530" y="115" width="300" height="140" rx="14" fill="#e8f1fb" stroke="#3973a8" stroke-width="3"/><path d="M531 167 H829" stroke="#3973a8" stroke-width="2"/><text x="680" y="147" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">User</text><text x="542" y="193" font-family="Arial" font-size="15" fill="#334155">«abstract» User</text><text x="544" y="191" font-family="Arial" font-size="15" fill="#334155">+ Name: string</text><text x="544" y="216" font-family="Arial" font-size="15" fill="#334155">+ DisplayBooks(Library): void</text></g><g><rect x="95" y="390" width="330" height="145" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M96 442 H424" stroke="#24835b" stroke-width="2"/><text x="260" y="422" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">Librarian</text><text x="109" y="466" font-family="Arial" font-size="15" fill="#334155">+ EmployeeNumber: int</text><text x="109" y="491" font-family="Arial" font-size="15" fill="#334155">+ AddBook(Book, Library): void</text><text x="109" y="516" font-family="Arial" font-size="15" fill="#334155">+ RemoveBook(Book, Library): void</text></g><g><rect x="535" y="395" width="340" height="145" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M536 447 H874" stroke="#24835b" stroke-width="2"/><text x="705" y="427" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">LibraryUser</text><text x="549" y="471" font-family="Arial" font-size="15" fill="#334155">+ card: LibraryCard</text><text x="549" y="496" font-family="Arial" font-size="15" fill="#334155">+ BorrowBook(Book, Library): void</text></g><g><rect x="1010" y="440" width="245" height="105" rx="14" fill="#fff4dc" stroke="#be851e" stroke-width="3"/><path d="M1011 492 H1254" stroke="#be851e" stroke-width="2"/><text x="1132.5" y="472" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">LibraryCard</text><text x="1024" y="516" font-family="Arial" font-size="15" fill="#334155">+ Number: int</text></g><g><rect x="1090" y="120" width="330" height="230" rx="14" fill="#e9e8ff" stroke="#6458b5" stroke-width="3"/><path d="M1091 172 H1419" stroke="#6458b5" stroke-width="2"/><text x="1255" y="152" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">Library</text><text x="1104" y="196" font-family="Arial" font-size="15" fill="#334155">- books: Book[100]</text><text x="1104" y="221" font-family="Arial" font-size="15" fill="#334155">- borrowedBooks: Book[50]</text><text x="1104" y="246" font-family="Arial" font-size="15" fill="#334155">+ Display(): void</text><text x="1104" y="271" font-family="Arial" font-size="15" fill="#334155">+ Add(Book): void</text><text x="1104" y="296" font-family="Arial" font-size="15" fill="#334155">+ Remove(Book): void</text><text x="1104" y="321" font-family="Arial" font-size="15" fill="#334155">+ Borrow(Book): void</text></g><g><rect x="1510" y="170" width="250" height="155" rx="14" fill="#fce9e9" stroke="#c15454" stroke-width="3"/><path d="M1511 222 H1759" stroke="#c15454" stroke-width="2"/><text x="1635" y="202" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#172033">Book</text><text x="1524" y="246" font-family="Arial" font-size="15" fill="#334155">+ Title: string</text><text x="1524" y="271" font-family="Arial" font-size="15" fill="#334155">+ Author: string</text><text x="1524" y="296" font-family="Arial" font-size="15" fill="#334155">+ Year: int</text></g>
<rect x="80" y="690" width="1660" height="105" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="110" y="730" font-family="Arial" font-size="20" font-weight="bold" fill="#243b53">Source behavior to keep in mind</text>
<text x="110" y="765" font-family="Arial" font-size="16" fill="#334155">The Library owns fixed-size arrays of book references. Librarian and user actions pass the Library object into methods;</text>
<text x="110" y="790" font-family="Arial" font-size="16" fill="#334155">Borrowing checks availability, then moves the selected book from books[] to borrowedBooks[].</text>
