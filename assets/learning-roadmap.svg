<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">.NET Learning Journey roadmap</title>
<desc id="desc">Three isometric learning blocks represent C# Basics, Object-Oriented Programming, and Advanced C#.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".18"/></filter>
</defs>
<rect width="1120" height="520" rx="28" fill="url(#bg)"/>
<text x="560" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">.NET LEARNING JOURNEY</text>

<g filter="url(#shadow)">
  <polygon points="405,82 715,82 748,108 438,108" fill="#0f172a"/>
  <polygon points="405,82 438,108 438,168 405,142" fill="#1e293b"/>
  <polygon points="438,108 748,108 748,168 438,168" fill="#334155"/>
  <text x="593" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#fff">LEARNING PATHS</text>
</g>

<g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round">
  <path d="M560 168 V220 H212 V275"/>
  <path d="M560 220 V275"/>
  <path d="M560 220 H940 V275"/>
</g>

<g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle">
  <!-- Basics -->
  <polygon points="50,275 350,275 375,295 75,295" fill="#60a5fa"/>
  <polygon points="50,275 75,295 75,420 50,400" fill="#1d4ed8"/>
  <polygon points="75,295 375,295 375,420 75,420" fill="#2563eb"/>
  <text x="225" y="350" font-size="23" font-weight="bold" fill="#fff">01 · C# BASICS</text>
  <text x="225" y="380" font-size="15" fill="#dbeafe">Core language topics</text>

  <!-- OOP -->
  <polygon points="408,275 708,275 733,295 433,295" fill="#c4b5fd"/>
  <polygon points="408,275 433,295 433,420 408,400" fill="#5b21b6"/>
  <polygon points="433,295 733,295 733,420 433,420" fill="#7c3aed"/>
  <text x="583" y="350" font-size="23" font-weight="bold" fill="#fff">02 · OOP</text>
  <text x="583" y="380" font-size="15" fill="#ede9fe">Object-oriented concepts</text>

  <!-- Advanced C# -->
  <polygon points="765,275 1065,275 1090,295 790,295" fill="#6ee7b7"/>
  <polygon points="765,275 790,295 790,420 765,400" fill="#047857"/>
  <polygon points="790,295 1090,295 1090,420 790,420" fill="#059669"/>
  <text x="940" y="350" font-size="23" font-weight="bold" fill="#fff">03 · ADVANCED C#</text>
  <text x="940" y="380" font-size="15" fill="#d1fae5">Advanced language path</text>
</g>

<text x="560" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Open a path in the README to browse its topics and examples.</text>
</svg>