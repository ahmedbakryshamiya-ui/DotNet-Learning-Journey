<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12" fill="none" stroke="#45647f" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
<text x="50" y="60" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">QUIZ GAME — PROCESS FLOW</text>
<path d="M350 260 L470 260" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="238" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="470" y="255" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">question + answer arrays</text><path d="M720 245 L860 245" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="755" y="223" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="860" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">user answer + expected answer</text><path d="M1025 335 L1025 440" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="920" y="418" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="1025" y="435" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">true</text><path d="M1190 260 L1340 260 L1340 440" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1235" y="238" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="1340" y="255" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">false or exception</text><path d="M860 500 L790 500 L790 650" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="478" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="790" y="495" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">after all questions</text><path d="M1190 530 L1020 600 L800 690" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="915" y="578" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="1020" y="595" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">continue quiz</text>
<g><rect x="70" y="180" width="280" height="160" rx="14" fill="#e8f1fb" stroke="#3973a8" stroke-width="3"/><path d="M71 234 H349" stroke="#3973a8" stroke-width="2"/><text x="210" y="215" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Questions &amp; Answers</text><text x="88" y="252" font-family="Arial" font-size="15" fill="#334155">string[] questions</text><text x="88" y="275" font-family="Arial" font-size="15" fill="#334155">string[] answers</text><text x="88" y="298" font-family="Arial" font-size="15" fill="#334155">CorrectAnswer = 0</text></g><g><rect x="470" y="180" width="250" height="130" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M471 234 H719" stroke="#24835b" stroke-width="2"/><text x="595" y="215" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">for Loop</text><text x="488" y="252" font-family="Arial" font-size="15" fill="#334155">Ask questions[i]</text><text x="488" y="275" font-family="Arial" font-size="15" fill="#334155">Read userAnswer</text><text x="488" y="298" font-family="Arial" font-size="15" fill="#334155">Repeat for each question</text></g><g><rect x="860" y="175" width="330" height="160" rx="14" fill="#e9e8ff" stroke="#6458b5" stroke-width="3"/><path d="M861 229 H1189" stroke="#6458b5" stroke-width="2"/><text x="1025" y="210" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">IsTheAnswerCorrect()</text><text x="878" y="247" font-family="Arial" font-size="15" fill="#334155">Empty input → throw Exception</text><text x="878" y="270" font-family="Arial" font-size="15" fill="#334155">Otherwise compare exact strings</text><text x="878" y="293" font-family="Arial" font-size="15" fill="#334155">Case-sensitive comparison</text></g><g><rect x="860" y="440" width="260" height="115" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M861 494 H1119" stroke="#24835b" stroke-width="2"/><text x="990" y="475" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Correct Answer</text><text x="878" y="512" font-family="Arial" font-size="15" fill="#334155">Print Correct answer</text><text x="878" y="535" font-family="Arial" font-size="15" fill="#334155">CorrectAnswer++</text></g><g><rect x="1190" y="440" width="300" height="115" rx="14" fill="#fff4dc" stroke="#be851e" stroke-width="3"/><path d="M1191 494 H1489" stroke="#be851e" stroke-width="2"/><text x="1340" y="475" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Incorrect / Empty</text><text x="1208" y="512" font-family="Arial" font-size="15" fill="#334155">Show expected answer</text><text x="1208" y="535" font-family="Arial" font-size="15" fill="#334155">or caught exception message</text></g><g><rect x="470" y="650" width="330" height="105" rx="14" fill="#fce9e9" stroke="#c15454" stroke-width="3"/><path d="M471 704 H799" stroke="#c15454" stroke-width="2"/><text x="635" y="685" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Final Score</text><text x="488" y="722" font-family="Arial" font-size="15" fill="#334155">Print CorrectAnswer / questions.Length</text></g>
<rect x="55" y="675" width="1490" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="82" y="710" font-family="Arial" font-size="15" font-weight="bold" fill="#243b53">Three fixed questions are checked in order. Correct answers increase the score; each question produces one outcome.</text>
<text x="82" y="740" font-family="Arial" font-size="13" fill="#475569">Arrows are labeled with the action or data flow they represent.</text>
</svg>