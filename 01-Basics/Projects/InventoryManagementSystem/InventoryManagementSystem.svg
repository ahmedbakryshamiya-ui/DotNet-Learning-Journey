<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12" fill="none" stroke="#45647f" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
<text x="50" y="60" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">INVENTORY MANAGEMENT — PROCESS FLOW</text>
<path d="M300 250 L350 250 L350 160 L410 160" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="245" y="138" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="350" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">choice 1</text><path d="M300 280 L410 360" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="305" y="338" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="410" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">choice 2</text><path d="M300 320 L350 320 L350 560 L410 560" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="245" y="538" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="350" y="555" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">choice 3</text><path d="M300 230 L790 230 L790 310 L1350 310" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="288" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="790" y="305" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">choice 4</text><path d="M730 165 L810 165 L810 300 L900 300" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="705" y="278" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="810" y="295" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">write new row</text><path d="M730 360 L900 360" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="795" y="338" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="900" y="355" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">update quantity cell</text><path d="M900 420 L800 420 L800 570 L730 570" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="695" y="548" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="800" y="565" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">read stored rows</text>
<g><rect x="70" y="210" width="230" height="155" rx="14" fill="#e8f1fb" stroke="#3973a8" stroke-width="3"/><path d="M71 264 H299" stroke="#3973a8" stroke-width="2"/><text x="185" y="245" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Main Menu</text><text x="88" y="282" font-family="Arial" font-size="15" fill="#334155">1. Add product</text><text x="88" y="305" font-family="Arial" font-size="15" fill="#334155">2. Update product</text><text x="88" y="328" font-family="Arial" font-size="15" fill="#334155">3. View product</text><text x="88" y="351" font-family="Arial" font-size="15" fill="#334155">4. Exit</text></g><g><rect x="410" y="90" width="320" height="150" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M411 144 H729" stroke="#24835b" stroke-width="2"/><text x="570" y="125" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Addproduct()</text><text x="428" y="162" font-family="Arial" font-size="15" fill="#334155">Read name, quantity, price</text><text x="428" y="185" font-family="Arial" font-size="15" fill="#334155">Write next inventory row</text><text x="428" y="208" font-family="Arial" font-size="15" fill="#334155">productCount++</text></g><g><rect x="410" y="285" width="320" height="155" rx="14" fill="#fff4dc" stroke="#be851e" stroke-width="3"/><path d="M411 339 H729" stroke="#be851e" stroke-width="2"/><text x="570" y="320" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">UpdateProduct()</text><text x="428" y="357" font-family="Arial" font-size="15" fill="#334155">Search exact product name</text><text x="428" y="380" font-family="Arial" font-size="15" fill="#334155">If found: update quantity</text><text x="428" y="403" font-family="Arial" font-size="15" fill="#334155">Otherwise: product not found</text></g><g><rect x="410" y="500" width="320" height="125" rx="14" fill="#e9e8ff" stroke="#6458b5" stroke-width="3"/><path d="M411 554 H729" stroke="#6458b5" stroke-width="2"/><text x="570" y="535" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">ViewProduct()</text><text x="428" y="572" font-family="Arial" font-size="15" fill="#334155">Loop from 0 to productCount</text><text x="428" y="595" font-family="Arial" font-size="15" fill="#334155">Display name, quantity, and price</text></g><g><rect x="900" y="250" width="360" height="190" rx="14" fill="#fce9e9" stroke="#c15454" stroke-width="3"/><path d="M901 304 H1259" stroke="#c15454" stroke-width="2"/><text x="1080" y="285" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Inventory Array</text><text x="918" y="322" font-family="Arial" font-size="15" fill="#334155">string[50, 3]</text><text x="918" y="345" font-family="Arial" font-size="15" fill="#334155">Column 0: product name</text><text x="918" y="368" font-family="Arial" font-size="15" fill="#334155">Column 1: quantity</text><text x="918" y="391" font-family="Arial" font-size="15" fill="#334155">Column 2: price</text><text x="918" y="414" font-family="Arial" font-size="15" fill="#334155">productCount tracks used rows</text></g><g><rect x="1350" y="265" width="170" height="100" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><path d="M1351 319 H1519" stroke="#64748b" stroke-width="2"/><text x="1435" y="300" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Exit</text><text x="1368" y="337" font-family="Arial" font-size="15" fill="#334155">Environment.Exit(0)</text></g>
<rect x="55" y="635" width="1490" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="82" y="670" font-family="Arial" font-size="15" font-weight="bold" fill="#243b53">The program stores products in a 50 × 3 string array. Add writes a new row; Update changes quantity; View reads rows.</text>
<text x="82" y="700" font-family="Arial" font-size="13" fill="#475569">Arrows are labeled with the action or data flow they represent.</text>
</svg>