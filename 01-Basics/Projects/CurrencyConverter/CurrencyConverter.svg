<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12" fill="none" stroke="#45647f" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
<text x="50" y="60" font-family="Arial" font-size="28" font-weight="700" fill="#102a43">CURRENCY CONVERSION — PROCESS FLOW</text>
<path d="M330 240 L500 240" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="395" y="218" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="500" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">provides choices + amount</text><path d="M330 475 L420 475 L420 285 L500 285" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="315" y="263" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="420" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">source currency rate</text><path d="M830 240 L990 240" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="885" y="218" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="990" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">amountInEGP</text><path d="M330 500 L920 500 L920 290 L990 290" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="815" y="268" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="920" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">target currency rate</text><path d="M1330 240 L1370 240" fill="none" stroke="#45647f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1265" y="218" width="210" height="24" rx="6" fill="#ffffff" stroke="#d6e0e8"/><text x="1370" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">calculated result</text>
<g><rect x="70" y="170" width="260" height="140" rx="14" fill="#e8f1fb" stroke="#3973a8" stroke-width="3"/><path d="M71 224 H329" stroke="#3973a8" stroke-width="2"/><text x="200" y="205" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">User Input</text><text x="88" y="242" font-family="Arial" font-size="15" fill="#334155">From currency: 1–4</text><text x="88" y="265" font-family="Arial" font-size="15" fill="#334155">To currency: 1–4</text><text x="88" y="288" font-family="Arial" font-size="15" fill="#334155">Amount: double</text></g><g><rect x="70" y="400" width="260" height="150" rx="14" fill="#fff4dc" stroke="#be851e" stroke-width="3"/><path d="M71 454 H329" stroke="#be851e" stroke-width="2"/><text x="200" y="435" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Fixed Rates</text><text x="88" y="472" font-family="Arial" font-size="15" fill="#334155">USD = 48.5 EGP</text><text x="88" y="495" font-family="Arial" font-size="15" fill="#334155">EUR = 52.0 EGP</text><text x="88" y="518" font-family="Arial" font-size="15" fill="#334155">GBP = 60.0 EGP</text></g><g><rect x="500" y="165" width="330" height="150" rx="14" fill="#e7f6ef" stroke="#24835b" stroke-width="3"/><path d="M501 219 H829" stroke="#24835b" stroke-width="2"/><text x="665" y="200" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Convert Source to EGP</text><text x="518" y="237" font-family="Arial" font-size="15" fill="#334155">switch(from)</text><text x="518" y="260" font-family="Arial" font-size="15" fill="#334155">EGP = amount × source rate</text><text x="518" y="283" font-family="Arial" font-size="15" fill="#334155">Invalid choice → message + return</text></g><g><rect x="990" y="165" width="340" height="150" rx="14" fill="#e9e8ff" stroke="#6458b5" stroke-width="3"/><path d="M991 219 H1329" stroke="#6458b5" stroke-width="2"/><text x="1160" y="200" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Convert EGP to Target</text><text x="1008" y="237" font-family="Arial" font-size="15" fill="#334155">switch(to)</text><text x="1008" y="260" font-family="Arial" font-size="15" fill="#334155">result = EGP ÷ target rate</text><text x="1008" y="283" font-family="Arial" font-size="15" fill="#334155">Invalid choice → message + return</text></g><g><rect x="1370" y="190" width="190" height="100" rx="14" fill="#fce9e9" stroke="#c15454" stroke-width="3"/><path d="M1371 244 H1559" stroke="#c15454" stroke-width="2"/><text x="1465" y="225" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Display Result</text><text x="1388" y="262" font-family="Arial" font-size="15" fill="#334155">Print converted amount</text></g><g><rect x="500" y="430" width="830" height="120" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><path d="M501 484 H1329" stroke="#64748b" stroke-width="2"/><text x="915" y="465" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#172033">Conversion Formula</text><text x="518" y="502" font-family="Arial" font-size="15" fill="#334155">All conversions pass through EGP as the base currency.</text><text x="518" y="525" font-family="Arial" font-size="15" fill="#334155">Rates are hard-coded example values; they are not refreshed from a live service.</text></g>
<rect x="55" y="555" width="1490" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="82" y="590" font-family="Arial" font-size="15" font-weight="bold" fill="#243b53">Two switch statements convert through EGP. Rates are hard-coded example values.</text>
<text x="82" y="620" font-family="Arial" font-size="13" fill="#475569">Arrows are labeled with the action or data flow they represent.</text>
</svg>